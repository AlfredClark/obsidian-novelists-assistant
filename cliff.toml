# git-cliff ~ 配置文件
# https://git-cliff.org/docs/configuration

[changelog]
# 每个版本渲染到 changelog 的 Tera 模板。
# 参见 https://keats.github.io/tera/docs/#introduction
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}
"""
# 移除 changelog 正文的首尾空白字符。
trim = true
# 即使没有要处理的版本也渲染正文。
render_always = true
# 基于正则的后处理器数组，用于修改 changelog。
postprocessors = [
  # 将占位符 <REPO> 替换为 URL。
  #{ pattern = '<REPO>', replace = "https://github.com/orhun/git-cliff" },
]
# 输出文件路径
# output = "CHANGELOG.md"

[git]
# 按 Conventional Commits 规范解析提交。
# 参见 https://www.conventionalcommits.org
conventional_commits = true
# 排除不符合 Conventional Commits 规范的提交。
filter_unconventional = true
# 要求所有提交均为 Conventional Commits。
# 优先级高于 filter_unconventional。
require_conventional = false
# 按换行拆分提交，每行视为一条独立提交。
split_commits = true
# 基于正则的解析器数组，用于在进一步处理前修改提交信息。
commit_preprocessors = [
  # 将 issue 编号替换为链接模板，稍后在 `changelog.postprocessors` 中更新。
  #{ pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](<REPO>/issues/${2}))"},
  # 使用 https://github.com/crate-ci/typos 检查提交信息的拼写。
  # 拼写错误将自动修复。
  #{ pattern = '.*', replace_command = 'typos --write-changes -' },
]
# 防止 breaking 提交被提交解析器排除。
protect_breaking_commits = false
# 基于正则的解析器数组，用于从提交信息中提取数据。
# 将提交归入分组。
# 可选地设置提交的 scope，并可决定是否将提交排除在后续处理之外。
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->🚀 Features" },
  { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
  { message = "^doc", group = "<!-- 3 -->📚 Documentation" },
  { message = "^perf", group = "<!-- 4 -->⚡ Performance" },
  { message = "^refactor", group = "<!-- 2 -->🚜 Refactor" },
  { message = "^style", group = "<!-- 5 -->🎨 Styling" },
  { message = "^test", group = "<!-- 6 -->🧪 Testing" },
  { message = "^chore\\(release\\): prepare for", skip = true },
  { message = "^chore\\(deps.*\\)", skip = true },
  { message = "^chore\\(pr\\)", skip = true },
  { message = "^chore\\(pull\\)", skip = true },
  { message = "^chore|^ci", group = "<!-- 7 -->⚙️ Miscellaneous Tasks" },
  { body = ".*security", group = "<!-- 8 -->🛡️ Security" },
  { message = "^revert", group = "<!-- 9 -->◀️ Revert" },
  { message = ".*", body = ".*", group = "<!-- 10 -->💼 Other" },
]
# 排除未被任何提交解析器匹配的提交。
filter_commits = false
# 遇到未被任何提交解析器匹配的提交时报错。
fail_on_unmatched_commit = false
# 基于正则的链接解析器数组，用于提取外部引用并将其转换为 URL。
link_parsers = []
# 仅包含属于当前分支的标签。
use_branch_tags = false
# 按拓扑顺序而非时间顺序排列版本。
topo_order = false
# 按拓扑顺序而非时间顺序排列提交。
topo_order_commits = true
# changelog 中每个分组/版本内提交的排序方式。
# 允许的值：newest（最新在前）、oldest（最早在前）
sort_commits = "newest"
# 处理子模块的提交
recurse_submodules = false

[remote.github]
owner = "alfredclark"
repo = "obsidian-plugin-template"
